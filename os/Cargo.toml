[package]
name = "os"
version = "0.1.0"
edition = "2018"

[dependencies]
fdt = { path = "../dependency/fdt" }
rlibc = "1.0.0"
spin = "0.7"

[features]
boot-tests = []
fault-test = ["boot-tests"]

[profile.dev]
opt-level = 1
debug = 2
panic = "abort"

[profile.release]
debug = 2
panic = "abort"
lto = true
