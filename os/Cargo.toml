[package]
name = "os"
version = "0.1.0"
edition = "2018"

[dependencies]
crc = { version = "=3.4.0", default-features = false }
fdt = { path = "../dependency/fdt" }
gpt_disk_io = { version = "=0.17.0", default-features = false }
gpt_disk_types = { version = "=0.16.1", default-features = false }
rlibc = "1.0.0"
spin = "0.7"
virtio-drivers = { path = "../dependency/virtio-drivers", default-features = false, features = ["alloc"] }
smoltcp = { path = "../dependency/smoltcp", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "socket-tcp", "socket-udp", "socket-tcp-reno"] }
ktest = { path = "../crates/ktest", optional = true }
unwinding = { path = "../dependency/unwinding", optional = true, default-features = false, features = ["unwinder", "panicking", "personality", "fde-static", "dwarf-expr", "kernel-percpu"] }

[features]
ktest = ["dep:ktest", "dep:unwinding", "virtio-drivers/ktest"]

[profile.dev]
opt-level = 1
debug = 2
panic = "abort"

[profile.release]
debug = 2
panic = "abort"
lto = true

[profile.ktest-dev]
inherits = "dev"
panic = "unwind"
codegen-units = 16

[profile.ktest-release]
inherits = "release"
panic = "unwind"
codegen-units = 16

[profile.ktest-abort-dev]
inherits = "ktest-dev"
panic = "abort"

[profile.ktest-abort-release]
inherits = "ktest-release"
panic = "abort"
