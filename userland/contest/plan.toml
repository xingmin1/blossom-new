# 正式启动默认入口：启用初赛 12 组；LTP 只按 sets/ltp.toml 的 include 运行部分用例。
files = [
    "sets/basic.toml",
    "sets/busybox.toml",
    "sets/lua.toml",
    "sets/libctest.toml",
    "sets/iozone.toml",
    "sets/unixbench.toml",
    "sets/iperf.toml",
    "sets/libcbench.toml",
    "sets/lmbench.toml",
    "sets/netperf.toml",
    "sets/cyclictest.toml",
    "sets/ltp.toml",
]
override_files = ["overrides/local.toml", "overrides/basic-mount.toml"]
finish = "poweroff"

[defaults]
timeout_sec = 60
repeat = 1

# pre-2025 盘的 musl/glibc 子目录缺少原程序 PT_INTERP 请求的解释器路径和脚本 shebang 的 /bin/sh。
# prepare 在每次激活该 root 时修改当前挂载的比赛盘，原始镜像由 QEMU 工作盘策略（默认 fresh 复制）保护；不同架构的名字一并建立。
[roots.musl]
path = "/mnt/contest/musl"
cwd = "/"
mounts = ["dev", "shm", "proc", "tmp"]
env = { PATH = "/ltp/testcases/bin:/bin:/usr/bin:/", LD_LIBRARY_PATH = "/lib", HOME = "/" }
prepare = [
    ["/bin/busybox", "ln", "-sfn", "lib", "/mnt/contest/musl/lib64"],
    ["/bin/busybox", "ln", "-sf", "libc.so", "/mnt/contest/musl/lib/ld-musl-riscv64-sf.so.1"],
    ["/bin/busybox", "ln", "-sf", "libc.so", "/mnt/contest/musl/lib/ld-musl-riscv64.so.1"],
    ["/bin/busybox", "ln", "-sf", "libc.so", "/mnt/contest/musl/lib/ld-musl-loongarch-lp64d.so.1"],
    # musl 根内的 basic 程序请求 glibc 解释器，复制同盘 glibc 根的 loader。
    ["/bin/busybox", "sh", "-c", "/bin/busybox cp /mnt/contest/glibc/lib/ld-linux-*.so.1 /mnt/contest/musl/lib/"],
    # 盘内辅助脚本的 shebang 使用 /bin/sh 与 /bin/busybox。
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/musl/bin"],
    ["/bin/busybox", "ln", "-sf", "/busybox", "/mnt/contest/musl/bin/busybox"],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/musl/.blossom"],
    ["/bin/busybox", "cp", "/etc/contest/fixtures/basic-fat32.img", "/mnt/contest/musl/.blossom/fat32.img"],
    ["/bin/busybox", "cp", "/bin/busybox", "/mnt/contest/musl/.blossom/busybox"],
    ["/bin/busybox", "sh", "-c", "for name in sh cp sleep true; do target=/mnt/contest/musl/bin/$name; if [ ! -e \"$target\" ] && [ ! -L \"$target\" ]; then /bin/busybox ln -s /.blossom/busybox \"$target\" || exit; fi; done"],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/musl/code/lmbench_src/bin/build"],
    ["/bin/busybox", "sh", "-c", "target=/mnt/contest/musl/code/lmbench_src/bin/build/lmbench_all; [ -e \"$target\" ] || [ -L \"$target\" ] || /bin/busybox ln -s /lmbench_all \"$target\""],
    ["/bin/busybox", "sh", "-c", "target=/mnt/contest/musl/sort.src; [ -e \"$target\" ] || [ -L \"$target\" ] || /bin/busybox cp /etc/contest/fixtures/unixbench-sort.src \"$target\""],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/musl/etc"],
    ["/bin/busybox", "sh", "-c", "target=/mnt/contest/musl/etc/protocols; [ -e \"$target\" ] || [ -L \"$target\" ] || /bin/busybox cp /etc/contest/fixtures/protocols \"$target\""],
]

[roots.glibc]
path = "/mnt/contest/glibc"
cwd = "/"
mounts = ["dev", "shm", "proc", "tmp"]
env = { PATH = "/ltp/testcases/bin:/bin:/usr/bin:/", LD_LIBRARY_PATH = "/lib", HOME = "/" }
prepare = [
    ["/bin/busybox", "ln", "-sfn", "lib", "/mnt/contest/glibc/lib64"],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/glibc/bin"],
    ["/bin/busybox", "ln", "-sf", "/busybox", "/mnt/contest/glibc/bin/busybox"],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/glibc/.blossom"],
    ["/bin/busybox", "cp", "/etc/contest/fixtures/basic-fat32.img", "/mnt/contest/glibc/.blossom/fat32.img"],
    ["/bin/busybox", "cp", "/bin/busybox", "/mnt/contest/glibc/.blossom/busybox"],
    ["/bin/busybox", "sh", "-c", "for name in sh cp sleep true; do target=/mnt/contest/glibc/bin/$name; if [ ! -e \"$target\" ] && [ ! -L \"$target\" ]; then /bin/busybox ln -s /.blossom/busybox \"$target\" || exit; fi; done"],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/glibc/code/lmbench_src/bin/build"],
    ["/bin/busybox", "sh", "-c", "target=/mnt/contest/glibc/code/lmbench_src/bin/build/lmbench_all; [ -e \"$target\" ] || [ -L \"$target\" ] || /bin/busybox ln -s /lmbench_all \"$target\""],
    ["/bin/busybox", "sh", "-c", "target=/mnt/contest/glibc/sort.src; [ -e \"$target\" ] || [ -L \"$target\" ] || /bin/busybox cp /etc/contest/fixtures/unixbench-sort.src \"$target\""],
    ["/bin/busybox", "mkdir", "-p", "/mnt/contest/glibc/etc"],
    ["/bin/busybox", "sh", "-c", "target=/mnt/contest/glibc/etc/protocols; [ -e \"$target\" ] || [ -L \"$target\" ] || /bin/busybox cp /etc/contest/fixtures/protocols \"$target\""],
]
