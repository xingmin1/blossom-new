# basic 名单与盘内 basic/run-all.sh 一致（32 个，同顺序）；日常增减只改 include。
[[group]]
name = "basic"
roots = ["musl", "glibc"]
cwd = "/basic"
start = "#### OS COMP TEST GROUP START basic-{root} ####\n"
end = "#### OS COMP TEST GROUP END basic-{root} ####\n"

[[group.step]]
directory = "."
include = [
    "brk",
    "chdir",
    "clone",
    "close",
    "dup2",
    "dup",
    "execve",
    "exit",
    "fork",
    "fstat",
    "getcwd",
    "getdents",
    "getpid",
    "getppid",
    "gettimeofday",
    "mkdir_",
    "mmap",
    "mount",
    "munmap",
    "openat",
    "open",
    "pipe",
    "read",
    "sleep",
    "times",
    "umount",
    "uname",
    "unlink",
    "wait",
    "waitpid",
    "write",
    "yield",
]
exec = ["./{name}"]
before = "Testing {name} :\n"
