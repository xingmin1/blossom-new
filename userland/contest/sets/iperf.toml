# 原脚本以 iperf3 -s -D 启动服务端，守护进程脱离主命令进程组，脚本结束时也不停止它。
# cleanup 在同一 root 内用盘内 BusyBox 结束服务端，并等待其退出，避免打开的 /dev 文件阻止卸载。
# killall 无匹配时的非零状态由随后的等待循环取代；收尾要求没有 iperf3 进程。
# 等待受 defaults.timeout_sec 约束，超时后按 cleanup 错误停止会话。
[[group]]
name = "iperf"
roots = ["musl", "glibc"]

[[group.step]]
names = ["script"]
exec = ["/busybox", "sh", "/iperf_testcode.sh"]
timeout_sec = 600
cleanup = [["/busybox", "sh", "-c", "/busybox killall iperf3; while /busybox pidof iperf3 >/dev/null; do /busybox sleep 1; done"]]
