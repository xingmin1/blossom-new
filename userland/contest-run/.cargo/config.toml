[net]
offline = true

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[target.riscv64gc-unknown-linux-musl]
rustflags = ["-Ctarget-feature=+crt-static", "-Crelocation-model=static", "-Clink-self-contained=yes", "-Clink-arg=-no-pie"]

[target.loongarch64-unknown-linux-musl]
rustflags = ["-Ctarget-feature=+crt-static", "-Crelocation-model=static", "-Clink-self-contained=yes", "-Clink-arg=-no-pie"]
